name: Build and deploy Laravel API to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo, pdo_mysql

      - name: Install dependencies
        run: composer install --prefer-dist --no-dev --optimize-autoloader --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|APP_ENV=.*|APP_ENV=production|" .env
          sed -i "s|APP_DEBUG=.*|APP_DEBUG=false|" .env
          sed -i "s|APP_URL=.*|APP_URL=${{ secrets.APP_URL }}|" .env
          sed -i "s|DB_HOST=.*|DB_HOST=${{ secrets.DB_HOST }}|" .env
          sed -i "s|DB_DATABASE=.*|DB_DATABASE=${{ secrets.DB_DATABASE }}|" .env
          sed -i "s|DB_USERNAME=.*|DB_USERNAME=${{ secrets.DB_USERNAME }}|" .env
          sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.DB_PASSWORD }}|" .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Cache config & routes
        run: |
          php artisan config:cache
          php artisan route:cache

      - name: Create web.config
        run: |
          cat > web.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="Laravel Routes" stopProcessing="true">
                    <match url=".*"/>
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true"/>
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true"/>
                    </conditions>
                    <action type="Rewrite" url="public/{R:0}"/>
                  </rule>
                </rules>
              </rewrite>
              <httpErrors errorMode="Detailed"/>
            </system.webServer>
          </configuration>
          EOF

      - name: Create startup script
        run: |
          cat > startup.sh << 'EOF'
          #!/bin/bash
          cd /home/site/wwwroot
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan storage:link
          EOF
          chmod +x startup.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA975BC04762489C8B90F98AF1478F02 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BC3424B25C954BA4AB4A0E6EED36784D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_242C78D279BA4B06B828DAE9D57351D4 }}

      - name: Set PHP version and variables
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az webapp config set \
              --resource-group DefaultResourceGroup-EUS \
              --name laravel-api \
              --php-version 8.3

            az webapp config appsettings set \
              --resource-group DefaultResourceGroup-EUS \
              --name laravel-api \
              --settings \
                APP_ENV=production \
                APP_DEBUG=false \
                APP_URL="${{ secrets.APP_URL }}" \
                DB_CONNECTION=mysql \
                DB_HOST="${{ secrets.DB_HOST }}" \
                DB_PORT=3306 \
                DB_DATABASE="${{ secrets.DB_DATABASE }}" \
                DB_USERNAME="${{ secrets.DB_USERNAME }}" \
                DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'laravel-api'
          slot-name: 'Production'
          package: .

      - name: Set startup command
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az webapp config set \
              --resource-group DefaultResourceGroup-EUS \
              --name laravel-api \
              --startup-file "/home/site/wwwroot/startup.sh"

      - name: Restart app
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az webapp restart \
              --resource-group DefaultResourceGroup-EUS \
              --name laravel-api